name: Audit NOVA STRIKE game balance
on:
  push:
    branches: ['feat/nova-2-7-balance-audit']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Run deterministic 78-run balance telemetry
        run: node scripts/balance-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: balance-review
          path: balance-review/
          if-no-files-found: ignore
