name: Verify NOVA STRIKE

on:
  push:
    branches: ['feat/**', 'fix/facility-explosion-visible-v292']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run check
      - name: Regression tests
        run: npm test
      - name: Production build
        run: npm run build
