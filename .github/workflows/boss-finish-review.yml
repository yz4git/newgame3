name: Review boss rupture and escape
on:
  push:
    branches: ['feat/nova-boss-finish-review', 'main']
    paths:
      - 'app/boss-finish.ts'
      - 'app/invasion-director.ts'
      - 'app/finish-motion.ts'
      - 'app/fx-director.ts'
      - 'app/render.ts'
      - 'app/canvas.ts'
      - 'scripts/boss-finish-playtest.mjs'
      - '.github/workflows/boss-finish-review.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nova-boss-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  boss-finish-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install game and headless browser
        run: |
          npm ci
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Build and serve the production bundle
        run: |
          npm run build
          nohup npm exec -- vite preview --host 127.0.0.1 --port 5173 > /tmp/nova-vite.log 2>&1 &
          for i in {1..30}; do if curl -fsS http://127.0.0.1:5173/ >/dev/null; then exit 0; fi; sleep 2; done
          cat /tmp/nova-vite.log
          exit 1
      - name: Capture actual boss defeats over time
        run: node scripts/boss-finish-playtest.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boss-finish-review
          path: boss-finish-review/
          if-no-files-found: ignore
