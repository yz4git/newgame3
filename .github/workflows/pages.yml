name: Publish NOVA STRIKE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0
        with:
          enablement: true
      - name: Assemble published game
        run: |
          mkdir -p _site/assets
          cp index.html manifest.webmanifest sw.js icon.svg icon-192.png icon-512.png _site/
          cp assets/* _site/assets/
      - name: Upload game
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site
      - name: Deploy game
        id: deployment
        uses: actions/deploy-pages@v5.0.1
